name: PDF 跨平台診斷
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 直接驗證 PDF 功能與保護
        working-directory: cross-platform
        shell: bash
        run: |
          python -m pip install pyinstaller==6.19.0 pymupdf==1.27.1 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pyHanko==0.34.1 pyhanko-certvalidator==0.30.2 xsdata==26.2
          npm run test:pdf-core
          npm run test:safety
