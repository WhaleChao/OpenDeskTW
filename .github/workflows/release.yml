name: 建置並發布 macOS／Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: "--bundles app,dmg"
          # GitHub runner 已移除 WiX 3 驗證 MSI 所需的 VBScript 元件；
          # 採用 Tauri 官方支援的 NSIS 安裝包，避免舊式驗證器阻斷發布。
          - platform: windows-2022
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross-platform/src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝前端與 Tauri 相依套件
        working-directory: cross-platform
        run: npm ci
      - name: 安裝並封裝內建 PDF 核心
        working-directory: cross-platform
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.19.0 pymupdf==1.27.1 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pyHanko==0.34.1 pyhanko-certvalidator==0.30.2 xsdata==26.2
          npm run pdf-core:build
          npm run test:sidecar
      - name: 靜態檢查
        working-directory: cross-platform
        run: |
          npm run frontend:build
          npm run check
      - name: 核心自動測試
        working-directory: cross-platform
        run: |
          npm run test:traditional
          npm run test:contracts
          npm run test:pdf-core
          npm run test:safety
          npm run test:preferences
          npm run test:legal
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: 建置並附加至 GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENDESK_SOURCE_REVISION: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: cross-platform
          tagName: v__VERSION__
          releaseName: "全能文件工作台 v__VERSION__"
          releaseBody: "OpenDesk TW 2.9.0：日夜模式、六個工作區、PDF 文件保護、原子儲存、復原與跨平台修正。待 macOS／Windows 安裝與對應原始碼驗證完成後發布。採 AGPL-3.0-or-later。"
          releaseDraft: true
          prerelease: true
          releaseCommitish: ${{ github.sha }}
          includeUpdaterJson: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      - name: 驗證 Windows 安裝、工作區與移除
        if: runner.os == 'Windows'
        working-directory: cross-platform
        shell: pwsh
        run: ./scripts/verify_windows_install.ps1
      - name: 驗證 macOS DMG 與安裝版
        if: runner.os == 'macOS'
        working-directory: cross-platform
        run: bash scripts/verify_macos_install.sh
      - name: 上傳安裝驗證證據
        working-directory: cross-platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          source_version=$(node -p "require('./package.json').version")
          gh release upload "v${source_version}" *-install-verification.json --clobber

  source-bundle:
    name: 建立 AGPL 對應原始碼包
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝鎖定的建置相依套件
        working-directory: cross-platform
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pyinstaller==6.19.0 pymupdf==1.27.1 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 pyHanko==0.34.1 pyhanko-certvalidator==0.30.2 xsdata==26.2
      - name: 產生並驗證對應原始碼包
        working-directory: cross-platform
        run: npm run legal:source
      - name: 附加對應原始碼包至 GitHub Release
        working-directory: cross-platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          source_version=$(node -p "require('./package.json').version")
          gh release upload "v${source_version}" \
            "dist/complete-document-workbench-${source_version}-corresponding-source.tar.gz#全能文件工作台 ${source_version}－AGPL 對應原始碼" \
            "dist/complete-document-workbench-${source_version}-corresponding-source.tar.gz.sha256#AGPL 對應原始碼 SHA-256" \
            --clobber

  verify-release:
    name: 驗證完整發行套件
    needs: [build, source-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 下載並驗證套件與更新簽章
        working-directory: cross-platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source_version=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          gh release download "v${source_version}" --dir release-assets
          node scripts/verify_release_assets.mjs release-assets
          gh release upload "v${source_version}" release-assets/SHA256SUMS release-assets/latest.json release-assets/release-verification.json --clobber
